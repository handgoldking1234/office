<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바로오피스</title>
<meta name="description" content="광고 없이 휴대폰에서 엑셀·PPT 파일을 바로 열고 고치는 무료 웹 오피스">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바로오피스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 앱바 + 본문(홈/엑셀/PPT 화면 전환) + 하단 도구막대. 모바일 한 손 조작 우선 */
:root{
  /* 흰 바탕 · 주색 검정 · 강조 파랑 */
  --bg:#f4f4f5; --card:#ffffff; --raise:#eef0f2; --ink:#111111; --sub:#666b72; --line:#e2e4e8;
  --main:#111111; --accent:#0a66d8;
  --xl:#107c41; --xl-soft:#e3f3ea; --pp:#c8502a; --pp-soft:#fbe9e2;
  --grid-head:#f1f3f4; --grid-line:#e3e6ea; --sel:#0a66d8;
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);min-height:56px}
.bar .title{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:4px 0;cursor:pointer}
.bar .title small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--sub)}
.ib{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--grid-head)}
.ib svg{width:22px;height:22px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.xl{background:var(--xl);border-color:var(--xl);color:#fff}
.btn.pp{background:var(--pp);border-color:var(--pp);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 홈 */
#home{overflow:auto}
.home{max-width:720px;width:100%;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-family:var(--display);font-size:26px;line-height:1.3;margin:4px 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--sub);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.open-card{position:relative;border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer}
.file-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:1}
.open-card:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.note a{color:var(--accent);font-weight:500}
.open-card.drag{border-color:var(--accent)}
.open-card strong{font-family:var(--display);font-size:18px}
.open-card span{color:var(--sub);font-size:13px}
.new-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.new-btn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.new-btn .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.new-btn.x .ic{background:var(--xl-soft);color:var(--xl)}
.new-btn.p .ic{background:var(--pp-soft);color:var(--pp)}
.new-btn b{display:block;font-size:15px}
.new-btn small{color:var(--sub);font-size:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h h2{font-family:var(--display);font-size:16px;margin:0}
.sec-h span{font-size:12px;color:var(--sub)}
.recent{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rc:last-child{border-bottom:0}
.rc .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.rc .ic.x{background:var(--xl-soft);color:var(--xl)} .rc .ic.p{background:var(--pp-soft);color:var(--pp)}
.rc .nm{flex:1;min-width:0}
.rc .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .nm small{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.rc .del{color:var(--sub)}
.empty{padding:18px;color:var(--sub);font-size:14px;text-align:center}
.note{font-size:12px;color:var(--sub);line-height:1.6}

/* 엑셀 */
.fx{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.fx .addr{min-width:58px;padding:7px 8px;border-radius:8px;background:var(--grid-head);font-size:13px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.fx input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--card);overscroll-behavior:contain;position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}
.grid td,.grid th{border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);height:26px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.grid thead th{position:sticky;top:0;background:var(--grid-head);z-index:2;font-weight:500;color:var(--sub);font-size:12px;text-align:center}
.grid tbody th{position:sticky;left:0;background:var(--grid-head);z-index:1;font-weight:500;color:var(--sub);font-size:12px;text-align:center}
.grid thead th:first-child{left:0;z-index:3}
.grid td{cursor:cell;background-clip:padding-box}
.grid td.num{text-align:right}
.grid td.sel{box-shadow:inset 0 0 0 2px var(--sel)}
.grid th.hl{background:var(--xl-soft);color:var(--xl)}
.more{padding:12px;text-align:center}
.tabs{display:flex;align-items:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;white-space:nowrap;cursor:pointer;color:var(--sub);font-size:14px}
.tab.on{background:var(--xl-soft);color:var(--xl);font-weight:700}
.tabs .sp{flex:1}
.zoom{display:flex;align-items:center;gap:2px;flex:none}
.zoom span{font-size:12px;color:var(--sub);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

/* PPT */
.slides{flex:1;min-height:0;overflow:auto;padding:14px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .lbl{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sw.cur .lbl{color:var(--pp);font-weight:700}
.slide{position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);border-radius:4px;color:#000}
.sw.cur .slide{box-shadow:0 0 0 2px var(--pp),0 2px 8px rgba(0,0,0,.2)}
.shp{position:absolute;box-sizing:border-box}
.shp.ed{cursor:pointer}
.shp.sel{outline:2px dashed var(--accent);outline-offset:1px;touch-action:none;cursor:move}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible;word-break:keep-all;overflow-wrap:break-word}
.tx .pa{margin:0}
.shp img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.shp table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed}
.shp td{border:1px solid rgba(0,0,0,.25);vertical-align:top;overflow:hidden}
.tools{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);overflow-x:auto}
.tools .btn{padding:8px 12px;font-size:14px}
.tools .sp{flex:1}

/* 바텀시트 / 대화상자 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0;font-family:var(--display);font-size:17px}
.sheet p{margin:0;color:var(--sub);line-height:1.6;font-size:14px}
.sheet textarea,.sheet input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px}
.sheet textarea{min-height:140px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--grid-head);width:36px;height:36px;cursor:pointer;font-size:18px}
.stepper span{min-width:56px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.tg{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:38px;font-weight:700;cursor:pointer}
.tg.on{background:var(--ink);color:var(--bg)}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.swc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swc.on{outline:2px solid var(--accent);outline-offset:2px}
.swc.keep{background:conic-gradient(#e33,#fc3,#3c6,#39f,#c3f,#e33)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:70;color:#fff;font-weight:500}
.loading.on{display:grid}

/* 발표 모드 */
.show{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center;touch-action:pan-y}
.show.on{display:flex}
.show .cnt{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#aaa;font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none}
.show .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}

/* ===== 다크 테마 + 하단 탭 레이아웃 ===== */
.lu{flex:none;display:block}
.bar{background:var(--bg);border-bottom:0}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:500px;font-weight:700;background:transparent;border-color:#727272}
.btn.primary,.btn.xl{background:var(--accent);border-color:var(--accent);color:#000}
.btn.pp{background:var(--pp);border-color:var(--pp);color:#000}
.ib:hover{background:var(--raise)}
#home{overflow:hidden}
.hscroll{flex:1;min-height:0;overflow:auto;background:linear-gradient(#1c3a28 0,#121212 260px)}
.home{gap:26px;padding-top:12px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:0;border-radius:6px;padding:0 12px 0 0;min-height:60px;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink)}
.qc:hover,.qc:focus-within{background:rgba(255,255,255,.16)}
.qc .art{width:60px;align-self:stretch;display:grid;place-items:center;flex:none}
.qc b{display:block;font-size:14px;font-weight:700}
.qc small{color:var(--sub);font-size:12px}
.qc.open{grid-column:1/-1;min-height:72px}
.qc.open .art{width:72px;background:var(--accent);color:#000}
.qc.x .art{background:var(--xl-soft);color:var(--xl)}
.qc.p .art{background:var(--pp-soft);color:var(--pp)}
.qc.drag{outline:2px solid var(--accent)}
.sec-h h2{font-size:20px;font-weight:700}
.fchips{display:flex;gap:8px;margin:0 0 10px}
.fc{border:0;border-radius:500px;padding:7px 14px;background:var(--line);color:var(--ink);font-size:13px;cursor:pointer}
.fc.on{background:var(--accent);color:#000;font-weight:700}
.recent{background:none;border:0;border-radius:0}
.rc{padding:8px 4px;border-bottom:0;border-radius:6px;color:var(--ink)}
.rc:hover{background:rgba(255,255,255,.07)}
.rc .ic{width:46px;height:46px;border-radius:4px}
.rc .nm b{font-weight:500;font-size:15px}
.rc .del{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.bnav{display:flex;align-items:flex-end;justify-content:space-around;background:linear-gradient(rgba(18,18,18,.85),#000);padding:8px 16px calc(8px + env(safe-area-inset-bottom));flex:none}
.bn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;font-size:11px;color:var(--sub);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:8px}
.bn.on{color:var(--ink)}
.fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;border:0;cursor:pointer;margin-top:-26px;box-shadow:0 8px 20px rgba(0,0,0,.55)}
.fabw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.sheet{background:var(--raise)}
.sheet .new-btn{background:rgba(255,255,255,.06);border:0;color:var(--ink);width:100%}
.fx{background:var(--bg);border-bottom:1px solid var(--line)}
.fx input{background:var(--raise);border-color:transparent;border-radius:500px;padding-left:14px}
.fx .addr{border-radius:500px;background:var(--raise)}
.tabs,.tools{background:#000;border-top:0}
.tab{border-radius:500px}
.tab.on{background:var(--accent);color:#000}
.tools{gap:2px;align-items:center}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--sub);font-size:11px;padding:6px 10px;border-radius:10px;min-width:58px;white-space:nowrap;cursor:pointer;flex:none}
.tb:hover{color:var(--ink)}
.tb.pri{color:var(--accent)}
.tb.go{background:var(--accent);color:#000;border-radius:500px;flex-direction:row;font-size:13px;font-weight:700;padding:10px 16px;gap:6px}
.toast{background:var(--accent);color:#000;font-weight:500;border-radius:500px}
.file-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:1}

/* ===== 편집기: 썸네일 · 캔버스 · 속성 패널 ===== */
.hero h1,.hero p{word-break:keep-all}
.bar .title small{overflow:hidden;text-overflow:ellipsis}
.dk{flex:1;min-height:0;display:flex;position:relative}
.dk .slides{flex:1;min-width:0}
.thumbs{display:none;width:196px;flex:none;overflow:auto;padding:12px 10px;gap:8px;flex-direction:column;background:#000}
.th{display:flex;gap:8px;align-items:flex-start;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:12px;text-align:left}
.th>span{width:14px;text-align:right;flex:none}
.th .slide{pointer-events:none;border-radius:3px}
.th.cur{background:var(--raise);color:var(--ink)}
.th.cur .slide{box-shadow:0 0 0 2px var(--accent)}
.props{display:none;width:272px;flex:none;overflow:auto;background:var(--card);flex-direction:column;padding:4px 14px 16px}
.props.open{display:flex;position:absolute;left:0;right:0;bottom:0;max-height:54%;width:auto;z-index:20;border-radius:16px 16px 0 0;background:var(--raise);box-shadow:0 -8px 24px rgba(0,0,0,.55)}
@media(min-width:900px){
  .thumbs{display:flex}
  .props,.props.open{display:flex;position:static;width:272px;max-height:none;border-radius:0;background:var(--card);box-shadow:none;border-left:1px solid var(--line);padding-bottom:24px}
  .m-only{display:none!important}
  #deckView{position:relative}
  #deckTools{position:absolute;left:calc(50% - 38px);bottom:14px;transform:translateX(-50%);border-radius:16px;background:var(--raise);box-shadow:0 8px 28px rgba(0,0,0,.6);padding:6px 8px;z-index:25;max-width:calc(100% - 520px)}
  .dk .slides{padding-bottom:110px}
}
@media(max-width:899px){.w-only{display:none!important}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;position:sticky;top:0;background:inherit;z-index:1;min-height:44px}
.ph b{font-family:var(--display);font-size:15px}
.pg{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pg h4{margin:0;font-size:12px;color:var(--sub);font-weight:500}
.pg p{margin:0;font-size:12px;color:var(--sub);line-height:1.8}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pn{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:0 8px;min-width:0;flex:1}
.pn span{font-size:11px;color:var(--sub);white-space:nowrap}
.pn input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:7px 0;font-variant-numeric:tabular-nums}
.prow{display:flex;gap:8px;align-items:center}
.pbs{display:flex;gap:4px}
.pb{width:36px;height:36px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.pb.on{background:var(--accent);color:#000}
.pas{display:flex;flex-wrap:wrap;gap:6px}
.pact{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:500px;background:var(--bg);color:var(--ink);font-size:13px;padding:8px 12px;cursor:pointer}
.pact:hover,.pb:hover{filter:brightness(1.5)}
.swc.none{background:linear-gradient(to top right,#fff 45%,#e11d48 45% 55%,#fff 55%)}
.swc.pick{background:conic-gradient(#e33,#fc3,#3c6,#39f,#c3f,#e33);position:relative;overflow:hidden;display:inline-block}
.swc.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.shp.sel{outline:2px solid var(--accent)}
@media(hover:hover){.shp.ed:not(.sel):hover{outline:1px solid var(--accent)}}
.hd{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:2px;z-index:5;touch-action:none}
.hd::after{content:"";position:absolute;inset:-10px}
.hd.nw{left:-7px;top:-7px;cursor:nwse-resize}.hd.ne{right:-7px;top:-7px;cursor:nesw-resize}
.hd.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.hd.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.tb{position:relative}.tb.off{opacity:.35}
.dv{width:1px;align-self:stretch;background:var(--line);margin:6px 4px;flex:none}

/* ===== 보기 전용 문서 (PDF · 워드) ===== */
.pages{flex:1;min-height:0;overflow:auto;padding:14px 12px 28px;display:flex;flex-direction:column;align-items:safe center;gap:14px}
.paper{background:#fff;color:#111;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.paper.word{width:100%;max-width:820px;padding:32px 24px;line-height:1.75;font-size:15px;overflow-wrap:anywhere;overflow:visible}
.paper.word img{max-width:100%;height:auto}
.paper.word table{border-collapse:collapse;max-width:100%}
.paper.word td,.paper.word th{border:1px solid #bbb;padding:4px 8px;vertical-align:top}
.paper.word a{color:#1f6feb}
.rc .ic.d{background:#3a1620;color:#ff6b81}.rc .ic.w{background:#14284a;color:#6ea8ff}
.ro{font-size:12px;color:var(--sub);padding:0 8px;white-space:nowrap}

/* ===== 홈: 검색 · 보관함 목록 · 빠른 실행 격자 ===== */
.hscroll{background:var(--bg)}
.home{gap:22px;padding-top:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:8px;padding:0 14px;color:var(--sub)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:0}
.search:focus-within{outline:2px solid var(--accent)}
.sh{font-family:var(--display);font-size:13px;font-weight:500;color:var(--sub);margin:0 0 8px}
.sec-h .sh{margin:0}
.lst{display:flex;flex-direction:column;background:var(--card);border-radius:10px;overflow:hidden}
.lr{display:flex;align-items:center;gap:14px;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;width:100%}
.lr:last-child{border-bottom:0}
.lr:hover,.lr.on{background:var(--raise)}
.lr .ic{width:42px;height:42px;border-radius:6px;display:grid;place-items:center;flex:none}
.lr .nm{flex:1;min-width:0}
.lr .nm b{display:block;font-size:15px;font-weight:500}
.lr .nm small{font-size:12px;color:var(--sub)}
.lr .cv{color:var(--sub);flex:none}
.ic.x{background:var(--xl-soft);color:var(--xl)}.ic.p{background:var(--pp-soft);color:var(--pp)}.ic.d{background:#3a1620;color:#ff6b81}
.bdg{min-width:36px;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:700;text-align:center;color:#000;font-variant-numeric:tabular-nums;flex:none}
.bdg.x{background:var(--xl)}.bdg.p{background:var(--pp)}.bdg.d{background:#ff6b81}
.bdg.zero{background:var(--line);color:var(--sub)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:86px;border:1px solid #3d3d3d;border-radius:10px;background:transparent;color:var(--ink);font-size:13px;cursor:pointer;padding:10px 4px;text-align:center}
.qt:hover,.qt:focus-within,.qt.drag{background:var(--raise);border-color:var(--accent)}
/* ===== PDF 편집 ===== */
.paper{position:relative}
.pi{position:absolute;cursor:move;touch-action:none;white-space:pre;line-height:1.3;font-family:"Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
.pi img{width:100%;display:block;pointer-events:none}
.pi.sel{outline:2px solid #1f6feb}
.paper.curp{box-shadow:0 0 0 2px var(--accent),0 1px 4px rgba(0,0,0,.5)}

/* ===== 라이트 테마 마감 ===== */
.bar{background:var(--main);color:#fff}
.bar .title small{color:#b9bcc2}
.bar .ib{color:#fff}.bar .ib:hover{background:rgba(255,255,255,.16)}
.btn{border-color:#c9ccd2;background:var(--card)}
.btn.primary,.btn.xl{background:var(--main);border-color:var(--main);color:#fff}
.btn.pp{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ib:hover{background:var(--raise)}
.search{background:var(--card);border:1px solid var(--line)}
.lst{border:1px solid var(--line)}
.qt{background:var(--card);border-color:#cfd2d8}
.fc{background:var(--raise);color:var(--ink)}
.fc.on{background:var(--accent);color:#fff}
.sec-h .sh{margin:0;font-size:13px;font-weight:500}
.rc:hover{background:rgba(0,0,0,.05)}
.ic.d,.rc .ic.d{background:#fde8ec;color:#d6304a}
.rc .ic.w{background:#e5eefc;color:#1f5fd1}

.bdg.zero{background:var(--raise);color:var(--sub)}
.bnav{background:var(--card);border-top:1px solid var(--line)}
.fab,.tb.go{background:var(--main);color:#fff}
.fab{box-shadow:0 6px 16px rgba(0,0,0,.28)}
.sheet{background:var(--card)}
.sheet .new-btn{background:var(--raise)}
.fx{background:var(--card)}
.tabs,.tools{background:var(--card);border-top:1px solid var(--line)}
.tab.on{background:var(--accent);color:#fff}
.toast{background:var(--main);color:#fff}
.sw.cur .lbl{color:var(--accent)}
.sw.cur .slide{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.2)}
.thumbs{background:var(--raise)}
.th.cur{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.props.open{background:var(--card);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.pb.on{color:#fff}
.pact:hover,.pb:hover{filter:brightness(.94)}
.paper{box-shadow:0 1px 4px rgba(0,0,0,.25)}
@media(min-width:900px){

  .props,.props.open{background:var(--card);box-shadow:none}
}

/* IndexedDB 최근 파일 */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const q=indexedDB.open('baro-office',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>{this.db=q.result;res(q.result)};q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(r){return this.run('readwrite',s=>s.put(r)).catch(()=>{})},
  get(id){return this.run('readonly',s=>s.get(id)).catch(()=>null)},
  del(id){return this.run('readwrite',s=>s.delete(id)).catch(()=>{})},
  all(){return this.run('readonly',s=>s.getAll()).then(a=>a||[]).catch(()=>[])}
};

let dlPromise=null;
function getDownloads(){if(!dlPromise){dlPromise=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null)}return dlPromise}
getDownloads();
async function saveBytes(name,bytes){
  const dl=await Promise.race([getDownloads(),new Promise(r=>setTimeout(()=>r(undefined),1500))]);
  if(dl){try{await dl.save({filename:name,data:new Blob([bytes])});toast('내려받기를 시작했어요');return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('잠시 후 다시 눌러 주세요');return}}}
  try{const ext=extOf(name);const mime={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',csv:'text/csv'}[ext]||'application/octet-stream';
    const url=URL.createObjectURL(new Blob([bytes],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('내려받기를 시작했어요')}
  catch(e){toast('이 화면에서는 내려받기가 막혀 있어요')}
}

async function sniffKind(buf){
  const u=new Uint8Array(buf,0,Math.min(1024,buf.byteLength));let h='';for(let i=0;i<u.length;i++)h+=String.fromCharCode(u[i]);
  if(h.includes('%PDF-'))return'pdf';
  if(h.startsWith('PK')){try{const z=await JSZip.loadAsync(buf);if(z.file('ppt/presentation.xml'))return'pptx';if(z.file('xl/workbook.xml'))return'xlsx';if(z.file('word/document.xml'))return'docx'}catch(e){}}
  return null;
}
async function openFile(f){
  const KNOWN=['xlsx','xlsm','xls','csv','pptx','pdf','docx'];
  let name=f.name||'파일',ext=extOf(name);if(!name.includes('.'))ext='';
  const buf=await f.arrayBuffer();
  // 메신저로 받은 파일은 확장자가 없거나 틀린 경우가 있어 내용을 보고 종류를 정한다
  const sn=await sniffKind(buf);
  if(sn&&(!KNOWN.includes(ext)||(['pdf','pptx','docx'].includes(sn)&&sn!==ext))){if(ext!==sn)name+='.'+sn;ext=sn}
  if(ext==='ppt'||ext==='doc'||ext==='hwp'||ext==='hwpx'){toast('.'+ext+' 형식은 아직 열 수 없어요');return}
  if(!KNOWN.includes(ext)){toast('엑셀·PPT(.pptx)·PDF·워드(.docx) 파일을 골라 주세요');return}
  openRecord({id:'f'+Date.now()+Math.random().toString(36).slice(2,6),name,kind:{pptx:'deck',pdf:'pdf',docx:'word'}[ext]||'sheet',buf,updated:Date.now()},true);
}
async function openRecord(rec,isNew){
  loading(true);
  try{
    if(rec.kind==='sheet')await openSheetDoc(rec);else if(rec.kind==='pdf')await openPdfDoc(rec);else if(rec.kind==='word')await openWordDoc(rec);else await openDeckDoc(rec);
    rec.updated=Date.now();IDB.put({...rec});
  }catch(e){console.error(e);const why=e&&e.message?String(e.message).slice(0,80):'';toast(/^암호|불러오지/.test(why)?why:'파일을 열지 못했어요. 손상됐거나 암호가 걸린 파일일 수 있어요.'+(why?' ('+why+')':''),5000);show('home')}
  loading(false);
}

const XNS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const RELNS='http://schemas.openxmlformats.org/package/2006/relationships';
const CTNS='http://schemas.openxmlformats.org/package/2006/content-types';
const parseXml=s=>new DOMParser().parseFromString(s,'application/xml');
const serXml=d=>{let s=new XMLSerializer().serializeToString(d);if(!/^<\?xml/.test(s))s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s;return s};
const kids=(e,n)=>e?[...e.children].filter(c=>c.localName===n):[];
const kid=(e,n)=>{if(!e)return null;for(const c of e.children)if(c.localName===n)return c;return null};

async function openSheetDoc(rec){
  const ext=extOf(rec.name);
  let wb;
  if(ext==='csv'){let txt=new TextDecoder('utf-8').decode(rec.buf);if(txt.includes('\uFFFD'))try{txt=new TextDecoder('euc-kr').decode(rec.buf)}catch(e){}wb=XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string',raw:false})}
  else wb=XLSX.read(new Uint8Array(rec.buf),{type:'array',cellFormula:true,cellNF:true,cellStyles:true});
  let zip=null,map={};
  if(ext==='xlsx'||ext==='xlsm'){try{zip=await JSZip.loadAsync(rec.buf);map=await sheetPathMap(zip)}catch(e){zip=null}}
  doc={kind:'sheet',rec,wb,zip,map,edits:{},si:0,sel:{r:0,c:0},rowLimit:500,zoom:1,dirty:false,patch:!!zip&&Object.keys(map).length===wb.SheetNames.length};
  for(const n of wb.SheetNames)recalc(wb.Sheets[n]);
  show('sheetView');setTitle();renderTabs();renderGrid();selectCell(0,0);
}
async function sheetPathMap(zip){
  const wbx=parseXml(await zip.file('xl/workbook.xml').async('string'));
  const rels=parseXml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  const rmap={};for(const r of rels.getElementsByTagNameNS(RELNS,'Relationship'))rmap[r.getAttribute('Id')]=r.getAttribute('Target');
  const m={};
  for(const s of wbx.getElementsByTagNameNS(XNS,'sheet')){
    const id=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');
    let t=rmap[id];if(!t)continue;t=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'');
    m[s.getAttribute('name')]=t;
  }
  return m;
}
const curWs=()=>doc.wb.Sheets[doc.wb.SheetNames[doc.si]];

function renderTabs(){
  const t=$('#tabs');t.innerHTML='';
  doc.wb.SheetNames.forEach((n,i)=>{const b=el('button','tab'+(i===doc.si?' on':''),esc(n));b.onclick=()=>{$('#fxIn').blur();doc.si=i;doc.rowLimit=500;renderTabs();renderGrid();selectCell(0,0);$('#gridWrap').scrollTo(0,0)};t.appendChild(b)});
  if(!doc.patch){const a=el('button','tab','+ 시트');a.onclick=()=>{let k=doc.wb.SheetNames.length+1;while(doc.wb.SheetNames.includes('Sheet'+k))k++;XLSX.utils.book_append_sheet(doc.wb,XLSX.utils.aoa_to_sheet([[]]),'Sheet'+k);doc.si=doc.wb.SheetNames.length-1;renderTabs();renderGrid();selectCell(0,0);markDirty()};t.appendChild(a)}
  t.appendChild(el('span','sp'));
  const z=el('div','zoom',`<button class="ib" data-z="-1" aria-label="축소">${ic('minus',18)}</button><span>${Math.round(doc.zoom*100)}%</span><button class="ib" data-z="1" aria-label="확대">${ic('plus',18)}</button>`);
  z.onclick=e=>{const d=e.target.closest('[data-z]');if(!d)return;doc.zoom=Math.min(2,Math.max(.5,Math.round((doc.zoom+ +d.dataset.z*.1)*10)/10));const g=$('table.grid');if(g)g.style.zoom=doc.zoom;z.querySelector('span').textContent=Math.round(doc.zoom*100)+'%'};
  t.appendChild(z);
}

function cellText(c){
  if(!c)return'';
  if(c.w!=null)return c.w;
  if(c.v==null)return'';
  if(c.t==='n')return fmtNum(c.v,c.z);
  if(c.t==='b')return c.v?'TRUE':'FALSE';
  return String(c.v);
}
function fmtNum(v,z){if(z&&z!=='General'){try{return XLSX.SSF.format(z,v)}catch(e){}}if(!isFinite(v))return String(v);return String(+v.toPrecision(12))}
function cellBg(c){const s=c&&c.s;if(!s)return'';const fg=s.fgColor;if(s.patternType&&s.patternType!=='none'&&fg&&fg.rgb&&/^[0-9A-F]{6,8}$/i.test(fg.rgb)){const h=fg.rgb.slice(-6);if(h.toUpperCase()!=='FFFFFF')return'#'+h}return''}

function renderGrid(){
  const ws=curWs(),U=XLSX.utils;
  const rg=ws['!ref']?U.decode_range(ws['!ref']):{s:{r:0,c:0},e:{r:0,c:0}};
  const nR=Math.min(Math.max(rg.e.r+1+30,60),doc.rowLimit),nC=Math.min(Math.max(rg.e.c+1+6,15),400);
  doc.nR=nR;doc.nC=nC;
  const cover=new Set(),start={};
  for(const m of ws['!merges']||[]){start[m.s.r+','+m.s.c]=[m.e.r-m.s.r+1,m.e.c-m.s.c+1];for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)if(r!==m.s.r||c!==m.s.c)cover.add(r+','+c)}
  const cols=ws['!cols']||[],rows=ws['!rows']||[];
  const h=['<table class="grid" style="zoom:'+doc.zoom+'"><colgroup><col style="width:44px">'];
  for(let c=0;c<nC;c++){const ci=cols[c];let w=ci?(ci.hidden?0:(ci.wpx||(ci.wch?ci.wch*7+10:(ci.width?ci.width*7+5:0)))):0;if(!w)w=84;h.push(`<col style="width:${Math.max(w,24)}px">`)}
  h.push('</colgroup><thead><tr><th></th>');
  for(let c=0;c<nC;c++)h.push(`<th data-ch="${c}">${U.encode_col(c)}</th>`);
  h.push('</tr></thead><tbody>');
  for(let r=0;r<nR;r++){
    const ri=rows[r];const rh=ri&&ri.hpx?`height:${Math.max(ri.hpx,18)}px`:'';
    h.push(`<tr style="${ri&&ri.hidden?'display:none':rh}"><th data-rh="${r}">${r+1}</th>`);
    for(let c=0;c<nC;c++){
      const k=r+','+c;if(cover.has(k))continue;
      const a=U.encode_cell({r,c}),cell=ws[a];
      const sp=start[k];const span=sp?` rowspan="${sp[0]}" colspan="${sp[1]}"`:'';
      const bg=cellBg(cell);
      const cls=cell&&(cell.t==='n')?' class="num"':'';
      h.push(`<td data-r="${r}" data-c="${c}"${span}${cls}${bg?` style="background:${bg};color:#111"`:''}>${esc(cellText(cell))}</td>`);
    }
    h.push('</tr>');
  }
  h.push('</tbody></table>');
  if(rg.e.r+1>nR)h.push(`<div class="more"><button class="btn" id="moreRows">아래 500행 더 보기 (전체 ${rg.e.r+1}행)</button></div>`);
  const w=$('#gridWrap');w.innerHTML=h.join('');
  const mb=$('#moreRows');if(mb)mb.onclick=()=>{doc.rowLimit+=500;const st=w.scrollTop;renderGrid();w.scrollTop=st;selectCell(doc.sel.r,doc.sel.c,true)};
}
function tdAt(r,c){return $(`#gridWrap td[data-r="${r}"][data-c="${c}"]`)}
let fxOrig='';
function selectCell(r,c,noScroll){
  const U=XLSX.utils;
  r=Math.max(0,Math.min(r,doc.nR-1));c=Math.max(0,Math.min(c,doc.nC-1));
  for(const x of document.querySelectorAll('#gridWrap .sel,#gridWrap .hl'))x.classList.remove('sel','hl');
  doc.sel={r,c};
  const td=tdAt(r,c);if(td){td.classList.add('sel');if(!noScroll)td.scrollIntoView({block:'nearest',inline:'nearest'})}
  const ch=$(`#gridWrap th[data-ch="${c}"]`),rh=$(`#gridWrap th[data-rh="${r}"]`);if(ch)ch.classList.add('hl');if(rh)rh.classList.add('hl');
  const a=U.encode_cell({r,c});$('#addr').textContent=a;
  const cell=curWs()[a];
  fxOrig=cell?(cell.f?'='+cell.f:(cell.t==='n'&&cell.z&&/%/.test(cell.z)?cellText(cell):(cell.v!=null?(cell.t==='b'?(cell.v?'TRUE':'FALSE'):String(cell.v)):''))):'';
  $('#fxIn').value=fxOrig;
}
$('#gridWrap').addEventListener('click',e=>{const td=e.target.closest('td[data-r]');if(!td)return;selectCell(+td.dataset.r,+td.dataset.c,true)});
$('#gridWrap').addEventListener('dblclick',e=>{const td=e.target.closest('td[data-r]');if(!td)return;const i=$('#fxIn');i.focus();i.setSelectionRange(i.value.length,i.value.length)});
const fxIn=$('#fxIn');
function commitFx(){if(doc&&doc.kind==='sheet'&&fxIn.value!==fxOrig){setCell(doc.sel.r,doc.sel.c,fxIn.value);fxOrig=fxIn.value}}
fxIn.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(e.key==='Enter'){e.preventDefault();commitFx();selectCell(doc.sel.r+1,doc.sel.c)}
  else if(e.key==='Tab'){e.preventDefault();commitFx();selectCell(doc.sel.r,doc.sel.c+1)}
  else if(e.key==='Escape'){fxIn.value=fxOrig;fxIn.blur()}
});
fxIn.addEventListener('blur',commitFx);
document.addEventListener('keydown',e=>{
  if(!doc||doc.kind!=='sheet'||$('#scrim').classList.contains('on'))return;
  if(document.activeElement===fxIn)return;
  const k=e.key,s=doc.sel;
  const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Enter:[1,0],Tab:[0,1]}[k];
  if(mv){e.preventDefault();selectCell(s.r+mv[0],s.c+mv[1]);return}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();setCell(s.r,s.c,'');selectCell(s.r,s.c,true);return}
  if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){fxIn.focus();fxIn.value='';}
});

function setCell(r,c,text){
  const U=XLSX.utils,ws=curWs(),a=U.encode_cell({r,c}),name=doc.wb.SheetNames[doc.si];
  const old=ws[a]||{};let e,cell;
  const tt=text.trim();
  if(text===''){e={k:'e'};cell=old.s?{t:'z',s:old.s}:null}
  else if(tt[0]==='='&&tt.length>1){const f=tt.slice(1);e={k:'f',v:f};cell={t:'n',f,v:0,s:old.s,z:old.z}}
  else if(/^[-+]?(\d{1,3}(,\d{3})+|\d+)?(\.\d+)?([eE][-+]?\d+)?%?$/.test(tt)&&/\d/.test(tt)){let n=+tt.replace(/[,%]/g,'');if(tt.endsWith('%'))n/=100;e={k:'n',v:n};cell={t:'n',v:n,s:old.s,z:old.z||(tt.endsWith('%')?'0%':(tt.includes(',')?'#,##0':undefined))}}
  else if(/^(true|false)$/i.test(tt)){e={k:'b',v:/^true$/i.test(tt)};cell={t:'b',v:e.v,s:old.s}}
  else{e={k:'s',v:text};cell={t:'s',v:text,s:old.s}}
  if(cell){for(const k in cell)if(cell[k]===undefined)delete cell[k];ws[a]=cell}else delete ws[a];
  if(cell&&cell.z&&!doc.patch)XLSX.utils.format_cell(cell);
  const rg=ws['!ref']?U.decode_range(ws['!ref']):{s:{r,c},e:{r,c}};
  if(text!==''){rg.s.r=Math.min(rg.s.r,r);rg.s.c=Math.min(rg.s.c,c);rg.e.r=Math.max(rg.e.r,r);rg.e.c=Math.max(rg.e.c,c);ws['!ref']=U.encode_range(rg)}
  (doc.edits[name]=doc.edits[name]||{})[a]=e;
  recalc(ws);
  refreshCells(ws);
  markDirty();
}
function refreshCells(ws){
  for(const td of document.querySelectorAll('#gridWrap td[data-r]')){
    const a=XLSX.utils.encode_cell({r:+td.dataset.r,c:+td.dataset.c});const c=ws[a];
    const t=cellText(c);if(td.textContent!==t)td.textContent=t;
    td.classList.toggle('num',!!c&&c.t==='n');
  }
}

/* --- 간단 수식 계산기 --- */
class FErr{constructor(c){this.code=c}}
class Unsup{}
function recalc(ws){
  const keys=Object.keys(ws).filter(k=>k[0]!=='!'&&ws[k]&&ws[k].f);
  for(let pass=0;pass<4;pass++){
    let changed=false;
    for(const k of keys){const c=ws[k];let v;
      try{v=evalFormula(c.f,ws)}catch(e){if(e instanceof FErr)v=e;else continue}
      if(v&&v.range)v=v.range[0];
      let nt,nv,nw;
      if(v instanceof FErr){nt='e';nv=v.code;nw=v.code}
      else if(typeof v==='number'){nt='n';nv=v;nw=fmtNum(v,c.z)}
      else if(typeof v==='boolean'){nt='b';nv=v;nw=v?'TRUE':'FALSE'}
      else{nt='s';nv=v==null?'':String(v);nw=nv}
      if(c.v!==nv||c.t!==nt){changed=true}
      c.t=nt;c.v=nv;c.w=nw;
    }
    if(!changed)break;
  }
}
function tokenize(s){
  const T=[];let i=0;

    if(/\s/.test(ch)){i++;continue}
    if(ch==='"'){let j=i+1,str='';while(j<s.length){if(s[j]==='"'){if(s[j+1]==='"'){str+='"';j+=2;continue}break}str+=s[j++]}T.push({k:'str',v:str});i=j+1;continue}
    if(/^('[^']+'|[A-Za-z0-9_.\uAC00-\uD7A3]+)!/.test(rest))throw new Unsup();
    if((m=/^[A-Za-z_][A-Za-z0-9_.]*(?=\()/.exec(rest))){T.push({k:'fn',v:m[0].toUpperCase().replace(/^_XLFN\./,'')});i+=m[0].length;continue}
    if((m=/^\$?([A-Za-z]{1,3})\$?(\d+)(:\$?([A-Za-z]{1,3})\$?(\d+))?/.exec(rest))&&!/^[A-Za-z0-9_]/.test(rest.slice(m[0].length))){
      if(m[3])T.push({k:'rng',v:[m[1]+m[2],m[4]+m[5]]});else T.push({k:'ref',v:m[1]+m[2]});i+=m[0].length;continue}
    if((m=/^(\d+\.?\d*([eE][-+]?\d+)?|\.\d+)/.exec(rest))){T.push({k:'num',v:+m[0]});i+=m[0].length;continue}
    if((m=/^(TRUE|FALSE)\b/i.exec(rest))){T.push({k:'bool',v:/^TRUE$/i.test(m[0])});i+=m[0].length;continue}
    if((m=/^(<=|>=|<>|[-+*\/^&=<>(),%:;])/.exec(rest))){T.push({k:'op',v:m[0]===';'?',':m[0]});i+=m[0].length;continue}
    throw new Unsup();
  }

}

  const rangeVals=(a,b)=>{const s=U.decode_cell(a.toUpperCase()),e=U.decode_cell(b.toUpperCase());const out=[];for(let r=Math.min(s.r,e.r);r<=Math.max(s.r,e.r);r++)for(let c=Math.min(s.c,e.c);c<=Math.max(s.c,e.c);c++)out.push(val(U.encode_cell({r,c})));return{range:out}};
  const num=x=>{if(x&&x.range){if(x.range.length===1)x=x.range[0];else throw new FErr('#VALUE!')}if(x==null||x==='')return 0;if(typeof x==='boolean')return x?1:0;if(typeof x==='number')return x;const n=+String(x).replace(/,/g,'');if(isNaN(n))throw new FErr('#VALUE!');return n};

    a={'=':x==y,'<>':x!=y,'<':x<y,'>':x>y,'<=':x<=y,'>=':x>=y}[o]}return a}
  function cat(){let a=add();while(isOp('&')){p++;a=str(a)+str(add())}return a}

    if(t.k==='fn'){p++;const args=[];if(!isOp(')')){args.push(cmp());while(isOp(',')){p++;args.push(isOp(')')||isOp(',')?null:cmp())}}if(!isOp(')'))throw new Unsup();p++;return callFn(t.v,args)}

  function nums(args,countText){const o=[];for(const a of args){if(a&&a.range){for(const v of a.range)if(typeof v==='number')o.push(v)}else if(a!=null&&a!=='')o.push(num(a))}return o}

    switch(n){

      case'ROUND':case'ROUNDUP':case'ROUNDDOWN':{const v=num(a[0]),d=a[1]==null?0:num(a[1]),m=Math.pow(10,d);const x=v*m;const r=n==='ROUND'?Math.sign(x)*Math.round(Math.abs(x)+1e-9):n==='ROUNDUP'?Math.sign(x)*Math.ceil(Math.abs(x)-1e-9):Math.sign(x)*Math.floor(Math.abs(x)+1e-9);return r/m}
      case'INT':return Math.floor(num(a[0]));
      case'ABS':return Math.abs(num(a[0]));
      case'SQRT':return Math.sqrt(num(a[0]));
      case'POWER':return Math.pow(num(a[0]),num(a[1]));
      case'MOD':{const d=num(a[1]);if(d===0)throw new FErr('#DIV/0!');const v=num(a[0]);return v-d*Math.floor(v/d)}

      case'RIGHT':{const s=str(a[0]),k=a[1]==null?1:num(a[1]);return k?s.slice(-k):''}

/* --- 엑셀 저장: 원본 xlsx의 바뀐 셀만 고쳐 서식 유지 --- */
async function buildSheetFile(){
  const ext=extOf(doc.rec.name);
  if(ext==='csv'){const csv=XLSX.utils.sheet_to_csv(curWs());return{bytes:new TextEncoder().encode('\uFEFF'+csv).buffer,name:doc.rec.name}}
  let name=doc.rec.name;if(ext==='xls')name=name.replace(/\.xls$/i,'.xlsx');
  if(!doc.patch){const out=XLSX.write(doc.wb,{bookType:'xlsx',type:'array'});return{bytes:out,name}}
  const zip=doc.zip;
  for(const sn in doc.edits){
    const path=doc.map[sn];if(!path||!zip.file(path))continue;
    const dom=parseXml(await zip.file(path).async('string'));
    const sd=dom.getElementsByTagNameNS(XNS,'sheetData')[0];if(!sd)continue;
    const ws=doc.wb.Sheets[sn];
    const rowIdx={};for(const r of kids(sd,'row'))rowIdx[r.getAttribute('r')]=r;
    for(const a in doc.edits[sn]){
      const e=doc.edits[sn][a];const {r,c}=XLSX.utils.decode_cell(a);const rn=String(r+1);
      let row=rowIdx[rn];
      if(!row){if(e.k==='e')continue;row=dom.createElementNS(XNS,'row');row.setAttribute('r',rn);
        let after=null;for(const x of kids(sd,'row'))if(+x.getAttribute('r')>r+1){after=x;break}
        sd.insertBefore(row,after);rowIdx[rn]=row}
      let ce=null,next=null;
      for(const x of kids(row,'c')){const xc=XLSX.utils.decode_cell(x.getAttribute('r')).c;if(xc===c){ce=x;break}if(xc>c){next=x;break}}
      if(!ce){if(e.k==='e')continue;ce=dom.createElementNS(XNS,'c');ce.setAttribute('r',a);row.insertBefore(ce,next)}
      const fe=kid(ce,'f');
      if(fe&&fe.getAttribute('t')==='shared'&&fe.hasAttribute('ref'))unshare(dom,fe.getAttribute('si'),ws);
      for(const n of ['f','v','is'])for(const x of kids(ce,n))ce.removeChild(x);
      ce.removeAttribute('t');
      const add=(n,t)=>{const x=dom.createElementNS(XNS,n);x.textContent=t;ce.appendChild(x);return x};
      if(e.k==='s'){ce.setAttribute('t','inlineStr');const is=dom.createElementNS(XNS,'is');const t=dom.createElementNS(XNS,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=e.v;is.appendChild(t);ce.appendChild(is)}
      else if(e.k==='n')add('v',String(e.v));
      else if(e.k==='b'){ce.setAttribute('t','b');add('v',e.v?'1':'0')}
      else if(e.k==='f'){add('f',e.v);const cv=ws[a];if(cv&&cv.t==='n'&&typeof cv.v==='number'&&isFinite(cv.v))add('v',String(cv.v));else if(cv&&cv.t==='s'){ce.setAttribute('t','str');add('v',cv.v)}}
      else if(e.k==='e'&&!ce.hasAttribute('s'))row.removeChild(ce);
    }
    const dim=dom.getElementsByTagNameNS(XNS,'dimension')[0];if(dim&&ws['!ref'])dim.setAttribute('ref',ws['!ref']);
    zip.file(path,serXml(dom));
  }
  // 열 때 다시 계산하도록 표시하고 계산 순서 파일 제거
  const wbx=parseXml(await zip.file('xl/workbook.xml').async('string'));
  let calc=wbx.getElementsByTagNameNS(XNS,'calcPr')[0];
  if(!calc){calc=wbx.createElementNS(XNS,'calcPr');const order=['oleSize','customWorkbookViews','pivotCaches','smartTagPr','smartTagTypes','webPublishing','fileRecoveryPr','webPublishObjects','extLst'];let before=null;for(const x of wbx.documentElement.children)if(order.includes(x.localName)){before=x;break}wbx.documentElement.insertBefore(calc,before)}
  calc.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/workbook.xml',serXml(wbx));
  if(zip.file('xl/calcChain.xml')){
    zip.remove('xl/calcChain.xml');
    const rels=parseXml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
    for(const r of [...rels.getElementsByTagNameNS(RELNS,'Relationship')])if(/calcChain$/.test(r.getAttribute('Type')))r.parentNode.removeChild(r);
    zip.file('xl/_rels/workbook.xml.rels',serXml(rels));
    const ct=parseXml(await zip.file('[Content_Types].xml').async('string'));
    for(const o of [...ct.getElementsByTagNameNS(CTNS,'Override')])if(o.getAttribute('PartName')==='/xl/calcChain.xml')o.parentNode.removeChild(o);
    zip.file('[Content_Types].xml',serXml(ct));
  }
  doc.edits={};
  return{bytes:await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'}),name};
}
function unshare(dom,si,ws){
  for(const f of [...dom.getElementsByTagNameNS(XNS,'f')]){
    if(f.getAttribute('t')!=='shared'||f.getAttribute('si')!==si)continue;
    const a=f.parentNode.getAttribute('r');const c=ws[a];
    f.removeAttribute('t');f.removeAttribute('si');f.removeAttribute('ref');
    if(c&&c.f)f.textContent=c.f;
  }
}

const PNS='http://schemas.openxmlformats.org/presentationml/2006/main';
const ANS='http://schemas.openxmlformats.org/drawingml/2006/main';
const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const EMU_PT=12700;

function resolvePath(base,target){if(target.startsWith('/'))return target.slice(1);const parts=base.split('/');parts.pop();for(const s of target.split('/')){if(s==='..')parts.pop();else if(s!=='.')parts.push(s)}return parts.join('/')}
const relsPathOf=p=>{const i=p.lastIndexOf('/');return p.slice(0,i)+'/_rels/'+p.slice(i+1)+'.rels'};
async function loadPart(path){
  if(doc.parts[path])return doc.parts[path];
  const f=doc.zip.file(path);if(!f)return null;
  const part={path,dom:parseXml(await f.async('string')),rels:{}};
  const rp=relsPathOf(path),rf=doc.zip.file(rp);
  if(rf){part.relsDom=parseXml(await rf.async('string'));for(const r of part.relsDom.getElementsByTagNameNS(RELNS,'Relationship')){const t=r.getAttribute('Target');part.rels[r.getAttribute('Id')]={type:r.getAttribute('Type')||'',target:r.getAttribute('TargetMode')==='External'?null:resolvePath(path,t)}}}
  doc.parts[path]=part;return part;
}
const relOfType=(part,suffix)=>{for(const id in part.rels)if(part.rels[id].type.endsWith(suffix))return part.rels[id].target;return null};

async function openDeckDoc(rec){
  const zip=await JSZip.loadAsync(rec.buf);
  doc={kind:'deck',rec,zip,parts:{},media:{},slides:[],cur:0,sel:null,dirty:false,undo:[],redo:[],showProps:false};
  const pres=await loadPart('ppt/presentation.xml');
  const sz=pres.dom.getElementsByTagNameNS(PNS,'sldSz')[0];
  doc.cx=+(sz&&sz.getAttribute('cx'))||12192000;doc.cy=+(sz&&sz.getAttribute('cy'))||6858000;
  doc.defStyle=pres.dom.getElementsByTagNameNS(PNS,'defaultTextStyle')[0]||null;
  doc.ct=parseXml(await zip.file('[Content_Types].xml').async('string'));
  for(const sid of pres.dom.getElementsByTagNameNS(PNS,'sldId')){
    const rid=sid.getAttributeNS(RNS,'id');const t=pres.rels[rid]&&pres.rels[rid].target;if(!t)continue;

$('#show').addEventListener('pointerup',e=>{if(e.target.id==='showX'||sx0==null)return;const dx=e.clientX-sx0;sx0=null;if(Math.abs(dx)>40)stepShow(dx<0?1:-1);else stepShow(e.clientX<window.innerWidth/3?-1:1)});
document.addEventListener('keydown',e=>{if(!$('#show').classList.contains('on'))return;if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();stepShow(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();stepShow(-1)}else if(e.key==='Escape')endShow()});

let pgPromise=null;

const libs={};
function loadLib(url){return libs[url]||(libs[url]=new Promise((res,rej)=>{const x=document.createElement('script');x.src=url;x.onload=res;x.onerror=()=>{delete libs[url];rej(new Error('라이브러리를 불러오지 못했어요'))};document.head.appendChild(x)}))}
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js',PDFW='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js',MAMMOTH='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const PDFLIB='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
const zoomHtml=()=>`<div class="zoom"><button class="ib" data-z="-1" aria-label="축소">${ic('minus',18)}</button><span>${Math.round(doc.zoom*100)}%</span><button class="ib" data-z="1" aria-label="확대">${ic('plus',18)}</button></div>`;
function pageBar(label){const b=$('#pageBar');b.className='tabs';b.innerHTML=`<span class="tab on">${label}</span><span class="ro">보기 전용</span><span class="sp"></span>`+zoomHtml()}
function pdfBar(){
  const b=$('#pageBar');b.className='tools';
  const tb=(a,i,l,c='')=>`<button class="tb ${c}" data-a="${a}" title="${l}">${ic(i,22)}<span>${l}</span></button>`;
  const it=doc.psel&&doc.pages[doc.psel.idx]&&doc.pages[doc.psel.idx].items[doc.psel.k];
  if(it)b.innerHTML=(it.t==='text'?tb('edit','pencil','글자 고치기','pri'):'')+tb('del','trash','삭제')+tb('desel','x','해제')+'<span class="sp"></span>'+zoomHtml();
  else b.innerHTML=tb('text','type','글자','pri')+`<label class="tb" title="그림·서명">${ic('image',22)}<span>그림·서명</span><input type="file" class="file-hit pimg-in" accept="image/png,image/jpeg" aria-label="그림 넣기"></label>`+'<span class="dv"></span>'+tb('rot','rotate','쪽 회전')+tb('up','up','앞으로')+tb('down','down','뒤로')+tb('delp','trash','쪽 삭제')+'<span class="sp"></span>'+zoomHtml();
}
$('#pageBar').onclick=e=>{
  if(!doc)return;
  const d=e.target.closest('[data-z]');
  if(d){doc.zoom=Math.min(3,Math.max(.5,doc.zoom+ +d.dataset.z*.25));if(doc.kind==='pdf')renderPdf();else if(doc.kind==='word'){$('#pages .paper').style.zoom=doc.zoom;pageBar('워드')}return}
  const a=e.target.closest('[data-a]');if(a&&doc.kind==='pdf')pdfAct(a.dataset.a);
};
$('#pageBar').addEventListener('change',e=>{if(e.target.classList.contains('pimg-in')){const f=e.target.files[0];e.target.value='';if(f&&doc&&doc.kind==='pdf')pdfAddImage(f)}});
async function openPdfDoc(rec){
  await loadLib(PDFJS);const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=PDFW;
  // 워커 스크립트를 화면 쪽에 직접 올려 둔다: 앱 안 브라우저처럼 워커가 막힌 곳에서도 열리게
  try{await loadLib(PDFW)}catch(e){}
  let pdf;
  try{pdf=await L.getDocument({data:new Uint8Array(rec.buf.slice(0))}).promise}
  catch(e){if(e&&e.name==='PasswordException')throw new Error('암호가 걸린 PDF는 열 수 없어요');throw e}
  const v=(await pdf.getPage(1)).getViewport({scale:1});
  doc={kind:'pdf',rec,pdf,orig:rec.buf.slice(0),zoom:1,ratio:v.height/v.width,dirty:false,psel:null,pages:[]};
  for(let i=0;i<pdf.numPages;i++)doc.pages.push({src:i,rot:0,items:[]});
  show('pageView');setTitle();renderPdf(true);
}
let pio;
function renderPdf(reset){
  const box=$('#pages'),st=reset?0:box.scrollTop;box.innerHTML='';
  const W=Math.round(Math.min(box.clientWidth-24,900)*doc.zoom);
  if(pio)pio.disconnect();
  pio=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){pio.unobserve(e.target);drawPdfPage(e.target,W)}},{root:box,rootMargin:'800px 0px'});
  doc.pages.forEach((P,idx)=>{const d=el('div','paper');d.dataset.idx=idx;d.style.width=W+'px';d.style.height=Math.round(W*(P.ratio||doc.ratio))+'px';box.appendChild(d);pio.observe(d)});
  box.scrollTop=st;pdfBar();
}
async function drawPdfPage(d,W){
  const my=doc,P=my.pages[+d.dataset.idx];
  try{const pg=await my.pdf.getPage(P.src+1);if(doc!==my||!d.isConnected)return;
    const rot=(pg.rotate+P.rot)%360,v1=pg.getViewport({scale:1,rotation:rot}),dpr=Math.min(window.devicePixelRatio||1,2),vp=pg.getViewport({scale:W/v1.width*dpr,rotation:rot});
    P.ratio=v1.height/v1.width;
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);c.style.cssText='width:100%;display:block';
    d.style.height=Math.round(W*P.ratio)+'px';d.appendChild(c);drawItems(d,P);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
  catch(e){console.warn('pdf page',e)}
}
function drawItems(d,P){
  for(const x of d.querySelectorAll('.pi'))x.remove();
  const W=d.clientWidth,idx=+d.dataset.idx;
  P.items.forEach((it,k)=>{const e=el('div','pi');e.dataset.k=k;e.style.left=it.x*100+'%';e.style.top=it.y*100+'%';
    if(it.t==='text'){e.textContent=it.text;e.style.fontSize=it.fs*W+'px';e.style.color='#'+it.color;if(it.b)e.style.fontWeight='700'}
    else{e.style.width=it.w*100+'%';const im=document.createElement('img');im.src=it.src;im.alt='';e.appendChild(im)}
    if(doc.psel&&doc.psel.idx===idx&&doc.psel.k===k){e.classList.add('sel');if(it.t==='img'){const h=el('span','hd se');e.appendChild(h)}}
    d.appendChild(e)});
}
function curPaper(){const box=$('#pages'),br=box.getBoundingClientRect(),mid=br.top+br.height/2;let best=null,bd=1e9;for(const d of box.querySelectorAll('.paper')){const r=d.getBoundingClientRect(),dist=mid<r.top?r.top-mid:mid>r.bottom?mid-r.bottom:0;if(dist<bd){bd=dist;best=d}}return best}
function redrawPaper(idx){const d=$(`#pages .paper[data-idx="${idx}"]`);if(d)drawItems(d,doc.pages[idx]);pdfBar()}
function placeAt(d){const r=d.getBoundingClientRect(),br=$('#pages').getBoundingClientRect();const cy=Math.min(Math.max((br.top+br.height/2-r.top)/r.height,.05),.85);return{x:.12,y:cy}}
function pdfTextDialog(it){
  const COLORS=['000000','E11D48','1F6FEB','1F7A3F','6B7280','FFFFFF'];
  return openSheet((b,close)=>{
    let pt=it?it.pt:14,bold=it?!!it.b:false,color=it?it.color:'000000';
    b.innerHTML=`<h3>${it?'글자 고치기':'글자 넣기'}</h3><textarea id="pta" aria-label="내용" placeholder="넣을 글자">${esc(it?it.text:'')}</textarea>
      <div class="row"><div class="stepper"><button data-s="-1" aria-label="작게">−</button><span id="ppt">${pt}pt</span><button data-s="1" aria-label="크게">+</button></div><button class="tg${bold?' on':''}" id="pbt" aria-pressed="${bold}">B</button></div>
      <div class="sws">${COLORS.map(c=>`<button class="swc${c===color?' on':''}" data-c="${c}" style="background:#${c}" aria-label="#${c}"></button>`).join('')}</div>
      <div class="row end"><button class="btn" data-a="n">취소</button><button class="btn primary" data-a="y">${it?'적용':'넣기'}</button></div>`;
    b.onclick=e=>{
      const st=e.target.closest('[data-s]');if(st){pt=Math.max(6,Math.min(96,pt+ +st.dataset.s*(pt>=24?2:1)));$('#ppt',b).textContent=pt+'pt';return}
      if(e.target.id==='pbt'){bold=!bold;e.target.classList.toggle('on',bold);return}
      const sw=e.target.closest('.swc');if(sw){for(const x of b.querySelectorAll('.swc'))x.classList.remove('on');sw.classList.add('on');color=sw.dataset.c;return}
      const a=e.target.dataset.a;if(a==='n')close(null);if(a==='y'){const text=$('#pta',b).value.replace(/\s+$/,'');close(text?{text,pt,b:bold,color}:null)}
    };
  });
}
async function pdfAct(a){
  const d=curPaper();if(!d)return;const idx=+d.dataset.idx,P=doc.pages[idx];
  if(a==='text'){const r=await pdfTextDialog(null);if(!r)return;const v=await pageW(P);const pos=placeAt(d);P.items.push({t:'text',...pos,...r,fs:r.pt/v});doc.psel={idx,k:P.items.length-1};redrawPaper(idx);markDirty()}
  else if(a==='edit'){const s=doc.psel,it=doc.pages[s.idx].items[s.k];const r=await pdfTextDialog(it);if(!r)return;const v=await pageW(doc.pages[s.idx]);Object.assign(it,r,{fs:r.pt/v});redrawPaper(s.idx);markDirty()}
  else if(a==='del'){const s=doc.psel;doc.pages[s.idx].items.splice(s.k,1);doc.psel=null;redrawPaper(s.idx);markDirty()}
  else if(a==='desel'){const s=doc.psel;doc.psel=null;redrawPaper(s.idx)}
  else if(a==='rot'){P.rot=(P.rot+90)%360;delete P.ratio;doc.psel=null;renderPdf();markDirty()}
  else if(a==='up'||a==='down'){const j=idx+(a==='up'?-1:1);if(j<0||j>=doc.pages.length)return;[doc.pages[idx],doc.pages[j]]=[doc.pages[j],doc.pages[idx]];doc.psel=null;renderPdf();const t=$(`#pages .paper[data-idx="${j}"]`);if(t)t.scrollIntoView({block:'center'});markDirty();toast(`${j+1}쪽으로 옮겼어요`)}
  else if(a==='delp'){if(doc.pages.length<2){toast('한 쪽뿐이라 지울 수 없어요');return}if(!await ask(`${idx+1}쪽을 지울까요?`,'내려받기 전까지는 원본 파일이 바뀌지 않아요.','지우기',true))return;doc.pages.splice(idx,1);doc.psel=null;renderPdf();markDirty()}
}
async function pageW(P){const pg=await doc.pdf.getPage(P.src+1);return pg.getViewport({scale:1,rotation:(pg.rotate+P.rot)%360}).width}
async function pdfAddImage(file){
  if(!/^image\/(png|jpeg)$/.test(file.type)){toast('PNG·JPG 그림만 넣을 수 있어요');return}
  const d=curPaper();if(!d)return;const idx=+d.dataset.idx,P=doc.pages[idx];
  const src=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  const im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=src});
  const pos=placeAt(d);P.items.push({t:'img',...pos,w:.3,asp:(im.naturalHeight||3)/(im.naturalWidth||4),src,mime:file.type});
  doc.psel={idx,k:P.items.length-1};redrawPaper(idx);markDirty();
}
let pdrag=null;
const pagesBox=$('#pages');
pagesBox.addEventListener('pointerdown',e=>{
  if(!doc||doc.kind!=='pdf')return;
  const pi=e.target.closest('.pi');
  if(!pi){if(doc.psel){const i=doc.psel.idx;doc.psel=null;redrawPaper(i)}return}
  const d=pi.closest('.paper'),idx=+d.dataset.idx,k=+pi.dataset.k,hd=!!e.target.closest('.hd');let fresh=false,el2=pi;
  if(!(doc.psel&&doc.psel.idx===idx&&doc.psel.k===k)){const old=doc.psel;doc.psel={idx,k};if(old&&old.idx!==idx)redrawPaper(old.idx);redrawPaper(idx);fresh=true;el2=d.querySelector(`.pi[data-k="${k}"]`);if(e.pointerType==='touch'){pdrag=null;return}}
  e.preventDefault();try{el2.setPointerCapture(e.pointerId)}catch(_){}
  pdrag={el:el2,d,idx,k,hd,fresh,sx:e.clientX,sy:e.clientY,l:el2.offsetLeft,t:el2.offsetTop,w:el2.offsetWidth,moved:false};
});
pagesBox.addEventListener('pointermove',e=>{const g=pdrag;if(!g)return;const dx=e.clientX-g.sx,dy=e.clientY-g.sy;if(!g.moved&&Math.hypot(dx,dy)<4)return;g.moved=true;
  if(g.hd)g.el.style.width=Math.max(16,g.w+dx)+'px';else{g.el.style.left=g.l+dx+'px';g.el.style.top=g.t+dy+'px'}});
pagesBox.addEventListener('pointerup',e=>{const g=pdrag;pdrag=null;if(!g)return;const it=doc.pages[g.idx].items[g.k];
  if(g.moved){const W=g.d.clientWidth,H=g.d.clientHeight;if(g.hd)it.w=Math.min(1,g.el.offsetWidth/W);else{it.x=g.el.offsetLeft/W;it.y=g.el.offsetTop/H}redrawPaper(g.idx);markDirty()}
  else if(!g.fresh&&it.t==='text')pdfAct('edit')});
pagesBox.addEventListener('pointercancel',()=>{if(pdrag){const i=pdrag.idx;pdrag=null;redrawPaper(i)}});
function textCanvas(it,DW){
  const K=4,fpx=it.fs*DW*K,lines=it.text.split('\n'),c=document.createElement('canvas'),x=c.getContext('2d'),font=`${it.b?700:400} ${fpx}px "Noto Sans KR",sans-serif`;
  x.font=font;const lh=fpx*1.3;c.width=Math.ceil(Math.max(1,...lines.map(l=>x.measureText(l).width)))+2;c.height=Math.ceil(lh*lines.length)+2;
  x.font=font;x.fillStyle='#'+it.color;x.textBaseline='middle';lines.forEach((l,i)=>x.fillText(l,0,lh*i+lh/2));
  return{url:c.toDataURL('image/png'),w:c.width/K,h:c.height/K};
}
/* 저장: 원본 PDF 쪽을 순서대로 복사한 뒤 넣은 글자·그림을 그 위에 그림 */
async function buildPdfFile(){
  const edited=doc.pages.length!==doc.pdf.numPages||doc.pages.some((p,i)=>p.src!==i||p.rot||p.items.length);
  if(!edited)return{bytes:doc.orig.slice(0),name:doc.rec.name};
  await loadLib(PDFLIB);const {PDFDocument,degrees}=window.PDFLib;
  const src=await PDFDocument.load(doc.orig.slice(0),{ignoreEncryption:true}),out=await PDFDocument.create();
  const copied=await out.copyPages(src,doc.pages.map(p=>p.src));
  for(let n=0;n<copied.length;n++){
    const pg=copied[n],P=doc.pages[n];out.addPage(pg);
    const r=(((pg.getRotation().angle+P.rot)%360)+360)%360;if(P.rot)pg.setRotation(degrees(r));
    const {width:W,height:H}=pg.getSize(),DW=r%180?H:W,DH=r%180?W:H;
    for(const it of P.items){
      let img,w,h;
      if(it.t==='text'){const c=textCanvas(it,DW);img=await out.embedPng(c.url);w=c.w;h=c.h}
      else{img=it.mime==='image/jpeg'?await out.embedJpg(it.src):await out.embedPng(it.src);w=it.w*DW;h=w*it.asp}
      const dx=it.x*DW,dy=it.y*DH+h;let x,y;
      if(r===0){x=dx;y=H-dy}else if(r===90){x=dy;y=dx}else if(r===180){x=W-dx;y=dy}else{x=W-dy;y=H-dx}
      pg.drawImage(img,{x,y,width:w,height:h,rotate:degrees(r)});
    }
  }
  const u=await out.save();return{bytes:u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength),name:doc.rec.name};
}
async function openWordDoc(rec){
  await loadLib(MAMMOTH);
  const r=await window.mammoth.convertToHtml({arrayBuffer:rec.buf.slice(0)});
  const dom=new DOMParser().parseFromString(r.value,'text/html');
  for(const x of dom.querySelectorAll('script,style,iframe,object,embed,link,meta'))x.remove();
  for(const x of dom.querySelectorAll('*'))for(const a of [...x.attributes]){if(/^on/i.test(a.name))x.removeAttribute(a.name);else if((a.name==='href'||a.name==='src')&&/^\s*javascript:/i.test(a.value))x.removeAttribute(a.name)}
  for(const a of dom.querySelectorAll('a[href]')){a.target='_blank';a.rel='noopener'}
  doc={kind:'word',view:true,rec,zoom:1,dirty:false};
  show('pageView');setTitle();
  const box=$('#pages');box.innerHTML='';box.scrollTo(0,0);
  const paper=el('div','paper word');paper.innerHTML=dom.body.innerHTML||'<p>내용이 없는 문서예요.</p>';box.appendChild(paper);
  pageBar('워드');
}

window.addEventListener('pagehide',()=>{if(doc&&doc.dirty)persist(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&doc&&doc.dirty)persist(true)});
try{if(window.self!==window.top)$('#appHint').hidden=false}catch(e){$('#appHint').hidden=false}
refreshRecent();
